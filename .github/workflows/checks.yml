name: Development checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run data:validate && npm run data:review
      - run: npm run typecheck && npm run lint && npm run format:check && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build:demo && npm run test:e2e
      - run: npm run build:demo && npm run test:e2e
        env:
          NEXT_PUBLIC_BASE_PATH: /atlas-test
      - run: npm run build
# No deployment job: public launch remains gated on
# reviewed real data, working private/submission channels, and quality review.
